name: Export IPTV Repos

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  issues: read
  actions: write

jobs:
  export:
    runs-on: macos-latest
    env:
      OUTPUT_DIR: exports
      REPOS: iptv-org/iptv,Guovin/iptv-api,HerbertHe/iptv-sources,yuanzl77/IPTV,DangJin/awesome-iptv
      MAX_WORKERS: 8
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y git
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
      - name: Run exporter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$OUTPUT_DIR"
          python tools/export_agent.py --repos "$REPOS" --output-dir "$OUTPUT_DIR" --max-workers "$MAX_WORKERS"
      - name: Archive exports
        if: always()
        run: tar -czf exports.tar.gz exports 2>/dev/null || true
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-exports
          path: |
            exports/
            exports.tar.gz
